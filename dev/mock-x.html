<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Mock X home (dev)</title>
    <!-- Same load order as manifest.json: page hook first, then the content scripts. -->
    <script src="/dev/chrome-shim.js"></script>
    <script src="/src/page/hook.js"></script>
    <link rel="stylesheet" href="/src/content/content.css" />
    <script src="/src/shared/core.js"></script>
    <script src="/src/content/timeline.js"></script>
    <script src="/src/content/dom.js"></script>
    <script src="/src/content/chip.js"></script>
    <script src="/src/content/feed.js"></script>
    <script src="/src/content/widget.js"></script>
    <script src="/src/content/sidebar.js"></script>
    <script src="/src/content/main.js"></script>
    <script src="/dev/mock-x.js"></script>
    <style>
      body { margin: 0; background: #000; color: #e7e9ea; font: 15px/20px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
      a { color: inherit; text-decoration: none; }
      #react-root { display: flex; justify-content: center; }
      header.nav { width: 240px; padding: 12px; font-size: 20px; line-height: 2.4; }
      main { display: flex; gap: 30px; }
      [data-testid="primaryColumn"] { width: 600px; border-left: 1px solid #2f3336; border-right: 1px solid #2f3336; min-height: 100vh; }
      [role="tablist"] { display: flex; border-bottom: 1px solid #2f3336; }
      [role="tab"] { flex: 1; text-align: center; padding: 16px; color: #71767b; font-weight: 600; cursor: pointer; }
      [role="tab"][aria-selected="true"] { color: #e7e9ea; box-shadow: inset 0 -4px 0 #1d9bf0; }
      .cell-border { border-bottom: 1px solid #2f3336; }
      .tw { padding: 12px 16px; }
      .social { color: #71767b; font-size: 13px; margin: 0 0 4px 52px; }
      .row { display: flex; gap: 12px; }
      .avatar { width: 40px; height: 40px; border-radius: 50%; background: #333639; flex: none; }
      .content { flex: 1; min-width: 0; }
      .head { display: flex; align-items: center; }
      .uname { display: flex; flex-direction: row; gap: 4px; flex: 1; min-width: 0; }
      .name { font-weight: 700; }
      .muted { color: #71767b; }
      .ad { color: #71767b; margin-right: 8px; }
      .icons { color: #71767b; }
      .quote { border: 1px solid #2f3336; border-radius: 16px; padding: 12px; margin-top: 10px; }
      .photo { margin-top: 10px; height: 120px; border-radius: 16px; background: #16181c; }
      .actions { display: flex; justify-content: space-between; color: #71767b; margin-top: 12px; max-width: 420px; font-size: 13px; }
      .mod-h { margin: 0; padding: 12px 16px; font-size: 20px; }
      .usercell { padding: 12px 16px; }
      .showmore { display: block; padding: 16px; color: #1d9bf0; border-bottom: 1px solid #2f3336; }
      [data-testid="sidebarColumn"] { width: 350px; }
      .sticky { position: sticky; top: 0; }
      .search-wrap { padding: 8px 0; background: #000; position: sticky; top: 0; z-index: 2; }
      form[role="search"] input { width: 100%; box-sizing: border-box; padding: 12px 16px; border-radius: 999px; border: 1px solid #2f3336; background: #000; color: #e7e9ea; font: inherit; }
      .w { border: 1px solid #2f3336; border-radius: 16px; padding: 12px 16px; margin-bottom: 16px; }
      .w h2 { margin: 0 0 8px; font-size: 20px; }
      .footer { color: #71767b; font-size: 13px; padding: 0 16px; }
    </style>
  </head>
  <body>
    <div id="react-root">
      <header class="nav"><div>𝕏</div><div>Home</div><div>Explore</div><div>Notifications</div></header>
      <main role="main">
        <div data-testid="primaryColumn">
          <div role="tablist">
            <div role="tab" aria-selected="true" onclick="__xiqMock.selectTab(0)">For you</div>
            <div role="tab" aria-selected="false" onclick="__xiqMock.selectTab(1)">Following</div>
            <div role="tab" aria-selected="false" onclick="__xiqMock.selectTab(2)">AI</div>
          </div>
          <section aria-labelledby="tl-h"><div aria-label="Timeline: Your Home Timeline"><div id="timeline"></div></div></section>
        </div>
        <!-- Same nesting as X: sidebarColumn > div > div > div(sticky) > div > div(contents), search wrapper first. -->
        <div data-testid="sidebarColumn">
          <div>
            <div>
              <div class="sticky" style="top: -900px">
                <div>
                  <div id="sidebarContents">
                    <div class="search-wrap">
                      <div>
                        <div>
                          <div>
                            <form role="search"><input data-testid="SearchBox_Search_Input" placeholder="Search" /></form>
                            <div role="listbox" aria-label="Search suggestions"></div>
                          </div>
                        </div>
                      </div>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </main>
    </div>
  </body>
</html>
